<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="茄阅 QieYue">
  <defs>
    <linearGradient id="bg" x1="88" y1="36" x2="432" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a63"/>
      <stop offset="0.55" stop-color="#ef4b37"/>
      <stop offset="1" stop-color="#d23a2f"/>
    </linearGradient>
    <linearGradient id="page" x1="256" y1="190" x2="256" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f1ddc3"/>
    </linearGradient>
    <linearGradient id="leaf" x1="248" y1="132" x2="284" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ad982"/>
      <stop offset="1" stop-color="#3f8a46"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <circle cx="146" cy="92" r="188" fill="#ffffff" opacity="0.10"/>
    <circle cx="414" cy="448" r="152" fill="#7d140f" opacity="0.12"/>
  </g>
  <!-- A faint rim keeps the tile readable on a dark Dock/desktop. -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- open book -->
  <path d="M256 218c-42-26-96-31-146-16v152c50-15 104-10 146 18z" fill="url(#page)"/>
  <path d="M256 218c42-26 96-31 146-16v152c-50-15-104-10-146 18z" fill="url(#page)"/>
  <path d="M256 218v154" stroke="#dcc2a0" stroke-width="8" stroke-linecap="round"/>

  <g stroke="#d3b995" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <path d="M146 254c33-7 66-2 88 10"/>
    <path d="M146 292c33-7 66-2 88 10"/>
    <path d="M278 264c22-12 55-17 88-10"/>
    <path d="M278 302c22-12 55-17 88-10"/>
  </g>

  <!-- leaf sprouting from the spine -->
  <path d="M256 212c-24-28-30-58-9-80 27 7 43 35 35 78z" fill="url(#leaf)"/>
  <path d="M256 212c0-29 2-54-9-80" stroke="#2f6b36" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- bookmark -->
  <path d="M324 218v70l-20-15-20 15v-70z" fill="#f6b44c"/>
</svg>
