[package]
name = "qieyue"
version = "0.1.0"
edition = "2021"
description = "Pure Rust desktop client for the fqapi_core backend"

[dependencies]
fqapi_core = { path = "../rust" }
eframe = "0.31"
egui = "0.31"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
egui_extras = { version = "0.31", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
